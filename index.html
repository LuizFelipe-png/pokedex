<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Portfólio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Pokédex</h1>
        <p>Encontre e capture seus Pokémon!</p>
    </header>

    <main>
        <section class="busca">
            <form id="formBusca">
                <input
                    type="text"
                    id="inputBusca"
                    placeholder="Digite o nome ou número do Pokémon"
                    required>
                <button type="submit">Buscar</button>
            </form>
        </section>

        <p id="mensagem"></p>

        <section id="cartaoPokemon" hidden>
            <div class="pokemon">
                <h2 id="nomePokemon"></h2>
                <p id="numeroPokemon"></p>

                <img id="imagemPokemon" src="" alt="Pokémon">

                <div id="tiposPokemon"></div>

                <p id="descricaoPokemon"></p>

                <div class="informacoes">
                    <p>Peso: <span id="pesoPokemon"></span></p>
                    <p>Altura: <span id="alturaPokemon"></span></p>
                </div>

                <h3>Status</h3>
                <div id="listaStatus"></div>

                <div class="botoes">
                    <button id="btnAnterior">Anterior</button>
                    <button id="btnShiny">Shiny</button>
                    <button id="botao-capturar">Capturar</button>
                    <button id="btnProximo">Próximo</button>
                </div>
            </div>
        </section>

        <section class="party">
            <h2 id="titulo-party">Minha party (0/6)</h2>
            <ul id="party"></ul>
        </section>

        <section class="professor">
            <div class="titulo-professor">
                <h2 id="titulo-carvalho">Com o Professor Carvalho (0)</h2>
                <button id="btnExcluirTodos" type="button">
                    Excluir todos
                </button>
            </div>

            <p id="carvalho-vazio">
                Nenhum Pokémon com o Professor Carvalho.
            </p>

            <ul id="carvalho"></ul>
        </section>
    </main>

    <dialog id="dialogo-troca">
        <h2>Party cheia!</h2>
        <p id="texto-troca"></p>

        <ul id="opcoes-troca"></ul>

        <button id="cancelar-captura" type="button">
            Cancelar
        </button>
    </dialog>

    <script src="js/script.js"></script>
</body>
</html>
